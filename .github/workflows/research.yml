# 경제 1분 · 리서치팀 출근 시간표
# 평일(월~금) 오전 8시 43분(한국시간)에 새 보고서를 확인한다.
name: 리서치팀 - 새 보고서 확인

on:
  schedule:
    - cron: "43 23 * * 0-4"   # UTC 기준 일~목 23:43 = 한국시간 월~금 08:43
  workflow_dispatch:           # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write              # 결과 파일(reports.md)을 저장소에 저장하기 위해 필요

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: 사무실 문 열기 (저장소 내려받기)
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install requests beautifulsoup4

      - name: 새 보고서 확인
        run: python research/fetch_reports.py

      - name: 결과 저장 (커밋 & 푸시)
        run: |
          git config user.name "econ-1min-research-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/reports.md research/seen.json
          if git diff --cached --quiet; then
            echo "새 보고서 없음"
          else
            git commit -m "리서치팀: $(TZ=Asia/Seoul date +%Y-%m-%d) 보고서 목록 업데이트"
            git push
          fi
